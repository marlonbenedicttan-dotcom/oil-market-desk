# Render Blueprint — deploy "Oil Market Desk" from GitHub in one click (free).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: oil-market-desk
    # Native Node, not Docker: Render checks out the repo and runs `node server.js`. There is no
    # build step, no `npx esbuild` network fetch and no server boot inside the image build. The client
    # is served from public/ as source; the data is committed. This removes the whole class of
    # "build green, deploy red" failures. The Dockerfile is kept for local/other hosts.
    runtime: node
    plan: free             # free tier (sleeps after ~15 min idle, wakes on visit in 20-30s)
                           # → keep it awake: scripts/keepalive.sh, or a free uptime monitor hitting /health
    buildCommand: "true"   # no build: data and client are committed
    startCommand: "node server.js"
    # Deploy only when the branch's GitHub checks pass. A broken commit never reaches production, and
    # the test workflow (which includes the boot check) becomes the deploy gate.
    autoDeployTrigger: checksPass
    # Deploy churn. A push burst (several agent commits in a few minutes) makes Render start a
    # deploy per commit; with the workspace's Overlapping Deploy Policy set to Override the older
    # ones are cancelled and the dashboard fills with "failed" deploys while the site is fine. Set
    # Workspace Settings → Overlapping Deploy Policy → Wait. It is a workspace setting, not a
    # blueprint field, so it cannot live here. Docs, tests and workflow files do not change the
    # running service, so they no longer trigger a build at all.
    buildFilter:
      ignoredPaths:
        - "**/*.md"
        - "tests/**"
        - ".github/**"
    # /health is deliberately public even with AUTH_USER/AUTH_PASS set: Render probes this path to
    # decide a deploy is live, and a 401 from a password-protected "/" would mark every deploy failed.
    healthCheckPath: /health
    envVars:
      - key: EIA_API_KEY
        sync: false
      # Hour of the digest in UTC (the container's clock). 23 UTC = 07:00 in Singapore (UTC+8),
      # so the brief lands at breakfast. (It also catches up on the first wake after this hour.)
      - key: DIGEST_HOUR
        value: "23"
      - key: NOTIFY
        value: "off"       # desktop notifications are macOS-only
      # Daily digest + alert delivery. Set all three of SMTP_USER / SMTP_PASS / DIGEST_TO to turn on
      # email (SMTP_PASS is an app password, not your account password). WEBHOOK_URL is the alternative
      # (Slack/Discord) — either or both.
      # QUICKEST email: one free Resend API key. Sends from onboarding@resend.dev to your own address —
      # no domain, no app password, nothing else to set beyond DIGEST_TO.
      - key: RESEND_API_KEY
        sync: false        # resend.com → API Keys → create (free tier)
      - key: SMTP_USER
        sync: false        # e.g. you@gmail.com
      - key: SMTP_PASS
        sync: false        # app password
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"       # 465 = implicit TLS, 587 = STARTTLS
      - key: DIGEST_TO
        sync: false        # where the digest + alerts are sent
      - key: MAIL_FROM
        sync: false        # optional, defaults to SMTP_USER
      - key: WEBHOOK_URL
        sync: false        # optional Slack/Discord webhook
      # Durable storage. Without these, subscribers/rules/cooldowns live in .state.json and the free
      # tier WIPES IT on redeploy and on every sleep/wake. A free Upstash Redis (REST) URL + token makes
      # them survive — anyone can subscribe and stay subscribed.
      - key: UPSTASH_REDIS_REST_URL
        sync: false        # e.g. https://your-db.upstash.io
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Optional login. Set BOTH to put the whole dashboard behind basic auth — which also unlocks
      # server-side alert rules (they are site-wide, so they need the login; see /api/rules).
      - key: AUTH_USER
        sync: false
      - key: AUTH_PASS
        sync: false
