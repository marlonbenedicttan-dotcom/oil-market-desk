# Render Blueprint — deploy "Oil Market Desk" from GitHub in one click (free).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: oil-market-desk
    env: docker
    plan: free             # free tier (sleeps after 15 min idle, wakes on visit)
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: AISSTREAM_KEY
        sync: false        # enter in the Render dashboard
      - key: EIA_API_KEY
        sync: false
      - key: DIGEST_HOUR
        value: "7"
      - key: NOTIFY
        value: "off"       # desktop notifications are macOS-only
