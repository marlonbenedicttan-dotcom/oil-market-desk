<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Marlon's Watchtower">
  <title>Marlon's Watchtower</title>
  <defs>
    <radialGradient id="wt-sky" cx="50%" cy="44%" r="78%">
      <stop offset="0" stop-color="#3a2408"/>
      <stop offset="0.58" stop-color="#150f06"/>
      <stop offset="1" stop-color="#08080b"/>
    </radialGradient>
    <radialGradient id="wt-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9e00" stop-opacity="0.40"/>
      <stop offset="0.5" stop-color="#ff9e00" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff9e00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wt-face" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffc45c"/>
      <stop offset="0.55" stop-color="#ff9e00"/>
      <stop offset="1" stop-color="#f28000"/>
    </linearGradient>
    <clipPath id="wt-body">
      <path d="M 145 190 V 171 A 3 3 0 0 1 148 168 H 158 V 111 A 3 3 0 0 1 161 108 H 207 A 3 3 0 0 1 210 111 V 168 H 230 V 111 A 3 3 0 0 1 233 108 H 279 A 3 3 0 0 1 282 111 V 168 H 302 V 111 A 3 3 0 0 1 305 108 H 351 A 3 3 0 0 1 354 111 V 168 H 364 A 3 3 0 0 1 367 171 V 187 A 3 3 0 0 1 364 190 H 344 L 344 338 H 365 L 365 392 L 147 392 L 147 338 H 168 L 168 190 H 148 A 3 3 0 0 1 145 187 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#wt-sky)"/>

  <!-- Maskable variant: the tower sits inside the 40% safe circle (r 205 of 512),
       so Android's circle/squircle mask never clips it. -->
  <g transform="translate(256 256) scale(0.94) translate(-256 -250)">
    <ellipse cx="256" cy="250" rx="232" ry="214" fill="url(#wt-halo)"/>
    <path fill="url(#wt-face)" d="M 145 190 V 171 A 3 3 0 0 1 148 168 H 158 V 111 A 3 3 0 0 1 161 108 H 207 A 3 3 0 0 1 210 111 V 168 H 230 V 111 A 3 3 0 0 1 233 108 H 279 A 3 3 0 0 1 282 111 V 168 H 302 V 111 A 3 3 0 0 1 305 108 H 351 A 3 3 0 0 1 354 111 V 168 H 364 A 3 3 0 0 1 367 171 V 187 A 3 3 0 0 1 364 190 H 344 L 344 338 H 365 L 365 392 L 147 392 L 147 338 H 168 L 168 190 H 148 A 3 3 0 0 1 145 187 Z"/>
    <g clip-path="url(#wt-body)">
      <rect x="140" y="182" width="240" height="10" fill="#000000" opacity="0.17"/>
      <rect x="160" y="338" width="192" height="6" fill="#000000" opacity="0.14"/>
      <rect x="140" y="380" width="240" height="14" fill="#000000" opacity="0.10"/>
      <path d="M 158 108 H 207 M 230 108 H 279 M 302 108 H 351" stroke="#ffe0a3" stroke-opacity="0.9" stroke-width="3.5"/>
    </g>
  </g>
</svg>
