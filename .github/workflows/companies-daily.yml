name: companies-daily

# Prices and market caps after the US close, plus a fundamentals refresh for any company that filed a
# new 10-K or 10-Q. Render auto-deploys on the resulting commit.
on:
  schedule:
    # 01:10 UTC Tue–Sat: after the 16:00 ET close *and* after Nasdaq settles its end-of-day batch.
    # A run at 22:40 UTC was still being served the previous session, which shipped a day-old "1D".
    - cron: '10 1 * * 2-6'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # a rebase needs history, not just the tip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache SEC responses
        uses: actions/cache@v4
        with:
          path: data/cache
          key: sec-cache-${{ github.run_id }}
          restore-keys: sec-cache-
      - name: Refresh prices, caps and new filings
        env:
          SEC_UA: 'MarlonWatchtower/1.0 (marlonbenedicttan@gmail.com)'
        run: node scripts/refresh-daily.mjs
      - name: Re-attach curated themes
        run: node scripts/attach-us-themes.mjs
      - name: Price windows (6M, YTD)
        run: node scripts/build-price-changes.mjs
      - name: Japan (J-Quants, optional)
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          if [ -z "$JQUANTS_API_KEY" ]; then echo 'no J-Quants key — skipping Japan'; exit 0; fi
          node scripts/build-japan.mjs --days=1900
      - name: Korea (DART, optional)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -z "$DART_API_KEY" ]; then echo 'no DART key — skipping Korea'; exit 0; fi
          node scripts/build-korea.mjs --years=5
      - name: Calendar events
        run: node scripts/build-events.mjs
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/companies.json data/japan.json data/japan-series.json data/korea.json data/valuation.json data/events.json data/reconciliation.json data/invariants.json data/filings-state.json data/filings-changed.json data/snapshot.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo 'no data change'
          else
            git commit -m "chore: daily companies refresh ($(date -u +%Y-%m-%d))"
            # Another push (a human commit, or the other workflow) can land while this job runs. Rebase
            # onto it and retry instead of failing the whole run on a non-fast-forward.
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase -X theirs origin main && git push; then pushed=1; break; fi
              echo "push rejected (attempt $i) — rebasing and retrying"; sleep $((i * 5))
            done
            [ "$pushed" = "1" ] || { echo 'could not push after 5 attempts'; exit 1; }
          fi
