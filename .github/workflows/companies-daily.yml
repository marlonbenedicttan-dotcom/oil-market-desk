name: companies-daily

# Prices and market caps after the US close, plus a fundamentals refresh for any company that filed a
# new 10-K or 10-Q. Render auto-deploys on the resulting commit.
on:
  schedule:
    # 08:00 UTC Tue–Sat: after the Tokyo (06:00) and Seoul (06:30) closes, so Japan and Korea publish
    # the same-day close; the prior US session has long settled and its historical close is available.
    # The old 01:10 slot ran at 10:10 JST, before the Tokyo close, so Japan always shipped yesterday.
    - cron: '0 8 * * 2-6'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # A stalled SEC/Nasdaq socket must fail a request, not hold the whole refresh open.
      NODE_OPTIONS: '--import=./scripts/fetch-timeout.mjs'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1          # shallow: the rebase fetches the new tip itself
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache SEC responses
        uses: actions/cache@v4
        with:
          path: data/cache
          key: sec-cache-${{ github.run_id }}
          restore-keys: sec-cache-
      - name: New US listing profiles
        run: node scripts/fetch-us-descriptions.mjs --only-missing --limit=25 || echo 'US profile source unavailable, retry tomorrow'
      - name: Refresh prices, caps and new filings
        env:
          SEC_UA: 'MarlonWatchtower/1.0 (marlonbenedicttan@gmail.com)'
        run: node scripts/refresh-daily.mjs
      - name: Re-attach curated themes
        run: node scripts/attach-us-themes.mjs
      - name: Refresh the chart cache, then the price windows and chart series
        run: |
          # build-valuation is the only writer of data/cache/charts. It was not in this job, so the
          # daily chart build read a cache that only the weekly run refreshed — company charts were
          # updating weekly at best, and on a cold runner not at all.
          node scripts/build-valuation.mjs
          node scripts/build-sector-valuation.mjs
          node scripts/build-price-changes.mjs
          node scripts/build-us-charts.mjs
      - name: Japan (J-Quants, optional)
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          if [ -z "$JQUANTS_API_KEY" ]; then echo 'no J-Quants key — skipping Japan'; exit 0; fi
          node scripts/build-japan.mjs --days=1900
          # A newly listed company has no profile yet. Fill it the same night, capped so a throttled
          # source can never hold up the market — the tail lands on the next run. A normal day is a
          # no-op: the fetcher skips every company that already has a profile.
          node scripts/fetch-japan-profiles.mjs --limit=25 || echo 'new-listing profiles: source unavailable, retry tomorrow'
          node scripts/attach-japan-descriptions.mjs
          # The description pass runs after build-japan wrote the per-company detail files. Rebuild
          # them (only changed companies are rewritten) so a new listing's page is not one day behind.
          node scripts/build-company-details.mjs jp
      - name: Korea (DART, optional)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -z "$DART_API_KEY" ]; then echo 'no DART key — skipping Korea'; exit 0; fi
          # The daily build fetches the statements; the universe/share table and the quarter windows
          # are separate DART calls. Refresh them first so a new listing or a split is current.
          node scripts/refresh-korea-shares.mjs
          node scripts/refresh-korea-quarters.mjs
          node scripts/build-korea.mjs --years=5
          # Same for a new KOSPI listing: describe it tonight, capped, never fatal.
          node scripts/fetch-korea-descriptions.mjs --only-missing --limit=25 || echo 'new-listing descriptions: source unavailable, retry tomorrow'
          node scripts/attach-korea-descriptions.mjs
          node scripts/build-korea-list.mjs
          # The description pass above runs after build-korea wrote the per-company detail files.
          # Rebuild them (only changed companies are rewritten) so a new listing is not a day behind.
          node scripts/build-company-details.mjs kr
      # The vendor shows a rolling five-year table. Merge what is already committed so a fiscal year
      # that scrolls off the page stays on the company page — the record grows instead of following.
      - name: Keep every filed period
        run: node scripts/merge-history.mjs jp kr
      # The source only ever shows the last few years of bars. Keep the sessions that scrolled off.
      - name: Keep every traded session
        run: node scripts/merge-series.mjs us jp kr
      - name: Calendar events
        run: node scripts/build-events.mjs
      - name: Re-apply recorded restatements
        run: |
          node scripts/apply-restatements.mjs
          node scripts/derive-companies.mjs
      # The US has no per-company detail file; its quarter table lives in companies.json.
      - name: Keep every US quarter
        run: node scripts/merge-history.mjs us
      # Calculation audit + cross-market check. The cross-market gate is the dedicated
      # markets-audit-daily job, so a known non-US source issue does not block today's price commit.
      - name: Audit every market before publishing
        continue-on-error: true
        run: |
          node scripts/audit-calculations.mjs
          node scripts/audit-markets.mjs
      - name: Snapshot the macro backdrop seed
        continue-on-error: true
        run: |
          node scripts/build-regime-seed.mjs
          node scripts/build-risk-seed.mjs
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/companies.json data/us-profiles.json data/japan.json data/japan-list.json data/japan-series.json data/japan-companies data/japan-profiles.json data/korea.json data/korea-list.json data/korea-universe.json data/korea-companies data/korea-profiles.json data/valuation.json data/events.json data/reconciliation.json data/invariants.json data/filings-state.json data/filings-changed.json data/snapshot.json data/us-charts.json data/audit-markets.json data/charts data/regime-seed.json data/risk-seed.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo 'no data change'
          else
            git commit -m "chore: daily companies refresh ($(date -u +%Y-%m-%d))"
            # Another push (a human commit, or the other workflow) can land while this job runs. Rebase
            # onto it and retry instead of failing the whole run on a non-fast-forward.
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -X theirs origin main && git push; then pushed=1; break; fi
              echo "push rejected (attempt $i) — rebasing and retrying"; sleep $((i * 5))
            done
            [ "$pushed" = "1" ] || { echo 'could not push after 5 attempts'; exit 1; }
          fi
