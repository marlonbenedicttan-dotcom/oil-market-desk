name: companies-weekly

# Full rebuild: re-read the annual frames and every fundamentals pass. Catches drift the daily
# incremental job cannot see (a tag that stopped being used, a restatement, a new index member).
on:
  schedule:
    - cron: '20 5 * * 6'   # Saturdays 05:20 UTC
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # A stalled SEC/Nasdaq socket must fail a request, not hold the whole rebuild open.
      NODE_OPTIONS: '--import=./scripts/fetch-timeout.mjs'
    steps:
      - uses: actions/checkout@v5
        env:
          # The job-level preload cannot be resolved until the repo exists; checkout itself runs
          # before that and would fail with ERR_MODULE_NOT_FOUND.
          NODE_OPTIONS: ''
        with:
          fetch-depth: 1          # shallow: the rebase fetches the new tip itself
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache SEC responses
        uses: actions/cache@v4
        with:
          path: data/cache
          key: sec-cache-weekly-${{ github.run_id }}
          restore-keys: sec-cache-
      - name: Rebuild the company dataset
        env:
          SEC_UA: 'MarlonWatchtower/1.0 (marlonbenedicttan@gmail.com)'
        run: |
          # Re-read every SEC filer first: the filter can only narrow a broad set, and the committed
          # file is already the narrow one. Then take the S&P 1500 membership from SPTM's holdings.
          node scripts/build-companies-frames.mjs --years=5
          node scripts/filter-us-universe.mjs
          node scripts/fill-sic.mjs --limit=2000
          node scripts/fetch-nasdaq.mjs
          node scripts/refresh-prices.mjs
          node scripts/price-companies.mjs --limit=2000
          node scripts/complete-us-universe.mjs
          node scripts/attach-us-tiers.mjs
          node scripts/apply-weights.mjs
          node scripts/fill-gaps.mjs
          node scripts/ttm-earnings.mjs
          node scripts/balance-pass.mjs
          node scripts/refresh-us-equity.mjs
          node scripts/repair-revenue.mjs
          node scripts/repair-revenue.mjs --recon
          node scripts/fix-net-income.mjs
          node scripts/describe-companies.mjs --limit=1600
          node scripts/describe-nasdaq.mjs
          node scripts/describe-nasdaq.mjs --bad
          node scripts/clean-descriptions.mjs
          node scripts/finalize-descriptions.mjs
          node scripts/fetch-us-descriptions.mjs --only-missing --limit=200
          node scripts/attach-us-descriptions.mjs
          node scripts/align-periods.mjs
          node scripts/attach-provenance.mjs
          node scripts/detect-restatements.mjs
          node scripts/apply-restatements.mjs
          node scripts/build-cashflow.mjs
          node scripts/build-capital-metrics.mjs
          node scripts/build-quarters.mjs
          node scripts/resolve-quarters.mjs
          node scripts/resolve-fundamentals.mjs
          node scripts/fill-us-revenue.mjs
          node scripts/reconcile-ttm.mjs
          node scripts/sync-series.mjs
          node scripts/build-valuation.mjs
          node scripts/build-price-changes.mjs
          node scripts/build-sector-valuation.mjs
          node scripts/build-us-charts.mjs
          node scripts/derive-companies.mjs
          node scripts/reconcile-nasdaq.mjs
          node scripts/align-revenue.mjs
          node scripts/derive-companies.mjs
          node scripts/reconcile-nasdaq.mjs
          node scripts/arbitrate.mjs
          node scripts/verify-filing-index.mjs
          node scripts/attach-us-brands.mjs
          node scripts/attach-us-themes.mjs
          node scripts/merge-history.mjs us
          bash scripts/ci-audit.sh node scripts/audit-calculations.mjs
          bash scripts/ci-audit.sh node scripts/audit-deep.mjs
          bash scripts/ci-audit.sh node scripts/audit-universe.mjs
      - name: Korea (DART, optional)
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -z "$DART_API_KEY" ]; then echo 'no DART key — skipping Korea'; exit 0; fi
          node scripts/refresh-korea-universe.mjs
          node scripts/refresh-korea-shares.mjs
          node scripts/refresh-korea-quarters.mjs
          node scripts/build-korea.mjs --years=5
      - name: Re-apply recorded restatements
        run: |
          node scripts/apply-restatements.mjs
          node scripts/derive-companies.mjs
      - name: Rebuild the chart store after the final merge
        run: node scripts/build-chart-store.mjs us jp kr

      - name: Test the data before publishing
        run: |
          # A bot push does not trigger the test workflow. Gate the data here so a refresh that
          # breaks the suite cannot land and turn the next human push red.
          npm run check:boot
          # A data test failure is a source/data warning, not a reason to send a red workflow email.
          # Keep the previous dataset, exit green, and let the data-quality report carry the finding.
          if ! npm run test:data; then
            echo "::warning::data tests failed — keeping the previous dataset; the next run retries"
            git checkout -- data/ || true
            exit 0
          fi
          # The API test rewrites the deals store; it is not part of the data commit.
          git checkout -- data/deals-store.json 2>/dev/null || true
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/companies.json data/us-profiles.json data/valuation.json data/events.json data/reconciliation.json data/invariants.json data/snapshot.json data/us-charts.json data/audit-markets.json data/korea.json data/korea-list.json data/korea-universe.json data/korea-companies data/charts
          if git diff --staged --quiet; then
            echo 'no data change'
          else
            git commit -m "chore: weekly companies rebuild ($(date -u +%Y-%m-%d))"
            # Another push (a human commit, or the other workflow) can land while this job runs. Rebase
            # onto it and retry instead of failing the whole run on a non-fast-forward.
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -X theirs origin main && git push; then pushed=1; break; fi
              echo "push rejected (attempt $i) — rebasing and retrying"; sleep $((i * 5))
            done
            [ "$pushed" = "1" ] || { echo 'could not push after 5 attempts'; exit 1; }
          fi
