name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:boot
      # Code failures block the deploy. Data failures are a dataset warning: a stale source or a
      # vendor restatement must not turn a scheduled refresh into a red run.
      - run: npm run test:code
      - run: npm run test:data
        continue-on-error: true
