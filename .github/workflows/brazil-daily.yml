name: brazil-daily

# Brazil's prices and statements are not in companies-daily: this job keeps B3 in step with the other
# markets. B3 closes at 18:00 BRT (21:00 UTC), so 21:40 UTC is after the close and after Yahoo settles.
#
# The universe is the vendor's B3 exchange list: BDRs (31–39) and FII/funds are filtered, and one class
# per issuer is selected (PETR4, not PETR3). The vendor's cap is the company total, kept on that class.
#
# The build re-reads every statement page whose cache has expired (annual 7 days, quarterly 1 day), so a
# new filing flows through on its own. A throttled class-selection pass is visible in audit.noCoveredClass
# and filled on the next run.

on:
  schedule:
    - cron: '40 21 * * 1-5'   # 18:40 BRT, Mon–Fri
  workflow_dispatch: {}

concurrency:
  group: brazil-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Cache B3 statements, the exchange list and Yahoo prices
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data/cache/b3
            data/cache/brazil-sa
            data/cache/brazil-shares
            data/cache/brazil-bdr
          key: br-cache-${{ github.run_id }}
          restore-keys: br-cache-
      - name: Build domestic prices, class selection, statements and profiles
        run: npm run refresh:brazil
      # refresh:brazil ends with build-brazil-bdrs + merge-brazil-bdrs; the BDR lens stays separate.
      - name: Keep every filed period
        run: node scripts/merge-history.mjs br
      - name: Keep every traded session
        run: node scripts/merge-series.mjs br
      # A partial source (or a throttled crawl) must not delete companies; carry the last good ones.
      - name: Carry forward companies the source omitted
        run: node scripts/merge-market-refresh.mjs br
      - name: Refuse a collapsed build
        run: |
          if node scripts/audit-market-refresh.mjs br; then exit 0; fi
          echo "::warning::refresh deferred — keeping the previous dataset; the next run will retry"
          git checkout -- data/ || true
          exit 0
      - name: Audit the dataset
        run: bash scripts/ci-audit.sh npm run audit:brazil
      - name: Deep audit every number
        run: bash scripts/ci-audit.sh npm run audit:brazil:deep
      - name: Rebuild the chart store after the final merge
        run: node scripts/build-chart-store.mjs br

      - name: Test the data before publishing
        run: |
          # A bot push does not trigger the test workflow. Gate the data here so a refresh that
          # breaks the suite cannot land and turn the next human push red.
          npm run check:boot
          # A data test failure is a source/data warning, not a reason to send a red workflow email.
          # Keep the previous dataset, exit green, and let the data-quality report carry the finding.
          if ! npm run test:data; then
            echo "::warning::data tests failed — keeping the previous dataset; the next run retries"
            git checkout -- data/ || true
            exit 0
          fi
          # The API test rewrites the deals store; it is not part of the data commit.
          git checkout -- data/deals-store.json 2>/dev/null || true
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Every brazil* artifact the build writes, not a hand-kept list: brazil-bdr-data.json and
          # brazil-themes.json were missing, so `git pull --rebase` refused with "unstaged changes"
          # and this job failed on every run it ever had.
          git add data/brazil*.json data/brazil-series data/brazil-companies data/charts
          if git diff --staged --quiet; then
            echo 'no data change'
          else
            git commit -m "chore: daily Brazil refresh ($(date -u +%Y-%m-%d))"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -X theirs origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then pushed=1; break; fi
              echo "push rejected (attempt $i) — rebasing and retrying"; sleep $((i * 5))
            done
            [ "$pushed" = "1" ] || { echo 'could not push after 5 attempts'; exit 1; }
          fi
