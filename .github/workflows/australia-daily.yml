name: australia-daily

# Australia's prices and statements are not in companies-daily: this job keeps the ASX in step with the
# other markets. The ASX closes at 16:00 Sydney (05:00–06:00 UTC depending on the season) and the
# listed-companies CSV is regenerated in the evening, so 10:10 UTC is after both.
#
# The build re-reads every statement page whose cache has expired (annual 7 days, trailing 1 day), so a
# new filing flows through to the ratios on its own — there is no ASX announcement watcher behind this
# yet, and the run is resumable: a throttled company is counted in audit.throttled and filled next run.

on:
  schedule:
    - cron: '10 10 * * 1-5'   # 20:10–21:10 Sydney, Mon–Fri
  workflow_dispatch: {}

concurrency:
  group: australia-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # a rebase needs history, not just the tip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The stockanalysis statement cache is the big one; without it a cold run fetches ~6,600 pages.
      # Yahoo's price cache is short-lived, but keeping it makes a re-run on the same day cheap.
      - name: Cache ASX statements and Yahoo prices
        uses: actions/cache@v4
        with:
          path: |
            data/cache/asx
            data/cache/australia-sa
            data/cache/australia-shares
          key: au-cache-${{ github.run_id }}
          restore-keys: au-cache-
      - name: Build prices, statements and profiles
        run: npm run refresh:australia
      # Keep the fiscal years that scroll off the vendor's five-year table.
      - name: Keep every filed period
        run: node scripts/merge-history.mjs au
      - name: Keep every traded session
        run: node scripts/merge-series.mjs au
      # A rate-limited run loses companies and chart history. Refuse to publish that.
      - name: Refuse a collapsed build
        run: node scripts/audit-market-refresh.mjs au
      - name: Audit the dataset
        run: npm run audit:australia
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/australia.json data/australia-list.json data/australia-series data/australia-companies data/australia-profiles.json data/australia-brands.json data/australia-shares.json data/charts
          if git diff --staged --quiet; then
            echo 'no data change'
          else
            git commit -m "chore: daily Australia refresh ($(date -u +%Y-%m-%d))"
            # Another push (a human commit, or the US/Taiwan job) can land while this runs.
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -X theirs origin main && git push; then pushed=1; break; fi
              echo "push rejected (attempt $i) — rebasing and retrying"; sleep $((i * 5))
            done
            [ "$pushed" = "1" ] || { echo 'could not push after 5 attempts'; exit 1; }
          fi
