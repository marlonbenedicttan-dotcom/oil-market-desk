name: macro-snapshot

# Refresh data/macro.json from the IMF World Economic Outlook (which the deploy host can't
# reach) and commit it. The app serves that file. Runs weekly, on demand, and whenever the
# fetcher itself changes.
on:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/fetch-macro.mjs'
      - '.github/workflows/macro-snapshot.yml'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # a rebase needs history, not just the tip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch IMF WEO snapshot
        run: node scripts/fetch-macro.mjs
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/macro.json
          if git diff --staged --quiet; then
            echo 'No change to data/macro.json'
          else
            git commit -m 'chore: refresh macro snapshot (IMF WEO)'
            # Another push can land while this job runs: rebase and retry rather than fail.
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase -X theirs origin main && git push; then pushed=1; break; fi
              echo "push rejected (attempt $i) — rebasing and retrying"; sleep $((i * 5))
            done
            [ "$pushed" = "1" ] || { echo 'could not push after 5 attempts'; exit 1; }
          fi
