name: macro-snapshot

# Refresh the two upstream snapshots the app cannot fetch for itself:
#   data/macro.json — IMF World Economic Outlook (the deploy host gets a 403 WAF)
#   data/usda.json  — USDA PSD supply/demand bulk CSVs (~4 MB of zips; too heavy to fetch per request)
# The app serves both files, so the loop is: poll -> commit only on a real change -> Render redeploys on
# that commit -> the numbers are live. Neither source has a change feed or webhook, so polling is the only
# way to hear about a vintage; daily is frequent enough that a release lands within a day, and cheap
# enough not to bother the IMF or USDA.
#
# Daily polling is only viable because both fetchers compare the data and leave the file untouched when
# nothing moved. Otherwise every run would commit a one-line `updated` timestamp and redeploy the site.
#
# USDA lived on a LaunchAgent on the developer's Mac until Nov 2026. That job was the only thing
# refreshing usda.json, it silently failed (an IMF connect timeout aborted the run before USDA was
# reached, and a bare `git push` lost the race against the daily jobs), and nothing watched usda.json
# for staleness. Both fetchers are keyless, so this workflow is the whole story now.
on:
  schedule:
    - cron: '17 4 * * *' # daily 04:17 UTC — off the hours the market jobs use
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/fetch-macro.mjs'
      - 'scripts/fetch-usda.mjs'
      - '.github/workflows/macro-snapshot.yml'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1          # shallow: the rebase fetches the new tip itself
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # USDA first: it is the snapshot with no other path to production, so it must not be blocked by
      # an IMF outage. The IMF step is allowed to fail on its own, and only re-fails the job at the end.
      - name: Fetch USDA PSD balance
        run: node scripts/fetch-usda.mjs
      - name: Fetch IMF WEO snapshot
        id: imf
        continue-on-error: true
        run: node scripts/fetch-macro.mjs
      - name: Test the data before publishing
        run: |
          # A bot push does not trigger the test workflow. Gate the data here so a refresh that
          # breaks the suite cannot land and turn the next human push red.
          npm run check:boot
          # A data test failure is a source/data warning, not a reason to send a red workflow email.
          # Keep the previous dataset, exit green, and let the data-quality report carry the finding.
          if ! npm run test:data; then
            echo "::warning::data tests failed — keeping the previous dataset; the next run retries"
            git checkout -- data/ || true
            exit 0
          fi
          # The API test rewrites the deals store; it is not part of the data commit.
          git checkout -- data/deals-store.json 2>/dev/null || true
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/macro.json data/usda.json
          if git diff --staged --quiet; then
            echo 'No change to data/macro.json or data/usda.json'
          else
            git commit -m 'chore: refresh macro + USDA snapshots'
            # Another push can land while this job runs: rebase and retry rather than fail.
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -X theirs origin main && git push; then pushed=1; break; fi
              echo "push rejected (attempt $i) — rebasing and retrying"; sleep $((i * 5))
            done
            [ "$pushed" = "1" ] || { echo 'could not push after 5 attempts'; exit 1; }
          fi
      - name: Fail if the IMF fetch failed
        if: steps.imf.outcome == 'failure'
        run: |
          echo '::error::fetch-macro.mjs failed — data/macro.json was not refreshed (USDA still committed)'
          exit 1
