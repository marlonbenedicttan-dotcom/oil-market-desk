name: south-africa-daily

# South Africa's prices and statements are not in companies-daily: this job keeps the JSE in step with
# the other markets. The JSE closes at 17:00 SAST (15:00 UTC), so 15:40 UTC is after the close and after
# Yahoo settles.
#
# The universe is the vendor's Johannesburg exchange list. Six lines are foreign-domiciled secondary
# listings (CFR, PRX, ANH, ANG, BTI, GLN) whose statements come from the primary exchange; six lines are
# excluded by decision (BHG/S32 are in the Australia market, INP duplicates INL, AGL/MNP/QLT have no free
# statement page).
#
# The build re-reads every statement page whose cache has expired (annual 7 days, quarterly 1 day), so a
# new filing flows through on its own. A throttled pass is visible in audit.throttled and filled on the
# next run.

on:
  schedule:
    - cron: '40 15 * * 1-5'   # 17:40 SAST, Mon–Fri
  workflow_dispatch: {}

concurrency:
  group: south-africa-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache JSE statements, the exchange list and Yahoo prices
        uses: actions/cache@v4
        with:
          path: |
            data/cache/jse
            data/cache/southafrica-sa
            data/cache/southafrica-audit
          key: za-cache-${{ github.run_id }}
          restore-keys: za-cache-
      - name: Build prices, statements and profiles
        run: npm run refresh:southafrica
      - name: Keep every filed period
        run: node scripts/merge-history.mjs za
      - name: Keep every traded session
        run: node scripts/merge-series.mjs za
      # A partial source (or a throttled crawl) must not delete companies; carry the last good ones.
      - name: Carry forward companies the source omitted
        run: node scripts/merge-market-refresh.mjs za
      - name: Refuse a collapsed build
        run: |
          if node scripts/audit-market-refresh.mjs za; then exit 0; fi
          echo "::warning::refresh deferred — keeping the previous dataset; the next run will retry"
          git checkout -- data/ || true
          exit 0
      - name: Audit the dataset
        run: bash scripts/ci-audit.sh npm run audit:southafrica
      - name: Deep audit every number
        run: bash scripts/ci-audit.sh npm run audit:southafrica:deep
      - name: Rebuild the chart store after the final merge
        run: node scripts/build-chart-store.mjs za

      - name: Test the data before publishing
        run: |
          # A bot push does not trigger the test workflow. Gate the data here so a refresh that
          # breaks the suite cannot land and turn the next human push red.
          npm run check:boot
          # A data test failure is a source/data warning, not a reason to send a red workflow email.
          # Keep the previous dataset, exit green, and let the data-quality report carry the finding.
          if ! npm run test:data; then
            echo "::warning::data tests failed — keeping the previous dataset; the next run retries"
            git checkout -- data/ || true
            exit 0
          fi
          # The API test rewrites the deals store; it is not part of the data commit.
          git checkout -- data/deals-store.json 2>/dev/null || true
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/southafrica.json data/southafrica-list.json data/southafrica-series data/southafrica-companies data/southafrica-profiles.json data/southafrica-brands.json data/southafrica-themes.json data/southafrica-universe.json data/charts
          if git diff --staged --quiet; then
            echo 'no data change'
          else
            git commit -m "chore: daily South Africa refresh ($(date -u +%Y-%m-%d))"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash -X theirs origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then pushed=1; break; fi
              echo "push rejected (attempt $i) — rebasing and retrying"; sleep $((i * 5))
            done
            [ "$pushed" = "1" ] || { echo 'could not push after 5 attempts'; exit 1; }
          fi
